<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Half Court</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1d1f;--sub:#6b6b70;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16161a;--fg:#f2f2f4;--sub:#9a9aa2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16161a;--fg:#f2f2f4;--sub:#9a9aa2;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;-webkit-user-select:none;user-select:none;touch-action:none}
#mode{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;width:min(92vw,400px);font-size:14px;color:var(--sub);min-height:38px}
.m{flex:1;padding:9px;border:0;border-radius:10px;color:#fff;font-size:13px;font-weight:700}
#be{background:#2f9e4f}#bh{background:#d9482b}#bn{background:#6a1fb0}#br{background:#111;color:#ffd24a;box-shadow:0 0 0 2px #ffd24a inset}
.bar{display:flex;justify-content:space-between;width:min(92vw,400px);font-size:17px;font-weight:600}
.bar span{color:var(--sub);font-weight:500}
canvas{width:min(92vw,400px);max-height:48vh;aspect-ratio:7/8;border-radius:14px;display:block;touch-action:none}
#shoot{width:min(92vw,400px);padding:15px;border:0;border-radius:14px;background:#e8731a;color:#fff;font-size:18px;font-weight:700;touch-action:none}
#shoot:active{background:#c95f10}
#passbtn{width:min(92vw,400px);padding:12px;border:0;border-radius:14px;background:#c0392b;color:#fff;font-size:16px;font-weight:700;touch-action:none;margin-top:2px}
#passbtn:active{background:#962d22}
#passbtn:disabled{opacity:.45}
.row{display:flex;gap:6px;width:min(92vw,400px)}
#menu,#reset,#swap,#king{flex:1;min-width:0;padding:10px;border:0;border-radius:10px;background:#555;color:#fff;font-size:14px;font-weight:600}
#swap{background:#2b5fd9}
#king{background:#b8860b}
#fs,#snd{padding:4px 8px;border:0;border-radius:8px;background:#555;color:#fff;font-size:12px;font-weight:600}
:fullscreen canvas{max-height:62vh}
:-webkit-full-screen canvas{max-height:62vh}
p{margin:0;color:var(--sub);font-size:12px;text-align:center;width:min(92vw,400px)}
#mm{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;overflow:auto;touch-action:auto}
#mmb{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(86vw,340px)}
#mmb h1{margin:0;font-size:30px}
#mmb .sub{color:var(--sub);font-size:14px;margin-bottom:6px;text-align:center}
.mb{width:100%;padding:14px;border:0;border-radius:12px;background:#e8731a;color:#fff;font-size:17px;font-weight:700}
.mb small{display:block;font-size:12px;font-weight:500;opacity:.9;margin-top:3px}
.mb.back{background:#555;font-size:15px;padding:10px}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.swb{padding:16px 6px;border:3px solid transparent;border-radius:12px;color:#fff;font-size:15px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.swb.on{border-color:var(--fg)}
#mmb input{width:100%;padding:12px;font-size:17px;border-radius:10px;border:2px solid var(--sub);background:var(--bg);color:var(--fg);box-sizing:border-box;text-align:center;-webkit-user-select:text;user-select:text;touch-action:auto;text-transform:uppercase}
.mmsg{color:var(--fg);font-size:14px;min-height:20px;text-align:center}
</style>
</head>
<body>
<div id="mode"><span id="ml"></span><button class="m" id="be">Easy</button><button class="m" id="bh">Hard</button><button class="m" id="bn">Nightmare</button><button class="m" id="br">REAL AI</button></div>
<div class="bar"><div><span id="l1">Pts </span><b id="p">0</b></div><div><span id="l2">FG </span><b id="f">0/0</b></div><div><span id="l3">Green </span><b id="g">0</b></div><div style="display:flex;gap:4px"><button id="fs">Fullscreen</button><button id="snd" aria-label="Sound on or off">🔊</button></div></div>
<canvas id="c" width="420" height="480"></canvas>
<button id="shoot">HOLD TO SHOOT</button>
<button id="passbtn" style="display:none">PASS</button>
<p id="help">WASD / Arrows move • Space shoot • Q/E or double A/D spin • F or double S fade • R dunk (50% in paint) / double W pump fake outside the FT area • X pass, C force teammate shot (2v2). Controller: A pass, Y force shot. Drag or double-tap also work. Release in the green.</p>
<div class="row"><button id="menu">Menu</button><button id="reset">Reset</button><button id="swap" style="display:none">Defense mode</button><button id="king" style="display:none">King of the Court</button></div>
<div id="mm"><div id="mmb"></div></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const HX=180,HY=58,CEN=0.78,SPD=250;
let P={x:180,y:440},tg=null,hold=false,fill=0,shot=null,wait=0,pts=0,att=0,made=0,greens=0,msg='',msgC='#fff',msgT=0,last=0,mv=false,mode=null;
let lastTap=0,spin=null,spinCD=0,ht=0,lateT=0,blockTry=false,fade=0,fadeOn=false,jabs=0,jabT=0,jdx=0,jdy=0,dunk=null,lateMark=0,idle=0,angryN=0,stillT=0,stealCD=0,pd=null,turnCD=0;
const D={x:180,y:300},tgt={x:180,y:300};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=()=>Math.hypot(P.x-HX,P.y-HY);
const dd=()=>Math.hypot(D.x-P.x,D.y-P.y);
const halfW=()=>{const d=dist();const b=Math.max(0.16-0.13*clamp(d/380,0,1),d<=40?0.25:0.25-(d-40)*0.0025);const c=((dd()<58&&!(biteT>0))||lateMark>0)?b*(mode==='easy'?0.85:0.7):b;return (fadeOn?c*0.925:c)*[1,1.03,1.06,1.09][sk.shoot]};
const gc=()=>Math.min(CEN,1-halfW());
function say(t,c){msg=t;msgC=c||'#fff';msgT=1.1}
function stats(){if(king){const g=id=>document.getElementById(id);g('l1').textContent='You ';g('l2').textContent='Bot ';g('l3').textContent=exh?'To ':'First to ';g('p').textContent=exh?eMe:kMe;g('f').textContent=exh?eBot:kBot;g('g').textContent=exh?eT:3;return}
  const d=view==='def',g=id=>document.getElementById(id);g('l1').textContent=d?'Opp ':'Pts ';g('l2').textContent=d?'Opp FG ':'FG ';g('l3').textContent=d?'Stops ':'Green ';g('p').textContent=d?opts:pts;g('f').textContent=d?oMade+'/'+oAtt:made+'/'+att;g('g').textContent=d?stops:greens}
function showPick(s){be.style.display=bh.style.display=bn.style.display=bReal.style.display=s?'':'none';ml.textContent=s?'New possession:':lbl()}
const be=document.getElementById('be'),bh=document.getElementById('bh'),bn=document.getElementById('bn'),ml=document.getElementById('ml'),bReal=document.getElementById('br');
const isNM=m=>m==='nightmare'||m==='real'; // Real AI plays like Nightmare, then goes further
// ---- Real AI: harder than Nightmare, and it learns your habits ----
const rdHist={shots:[],spins:[],pumps:[]},realRead={fade:false,spin:false,pump:false,spot:false,three:false};
const dr={bites:0,blocks:0,steals:0}; // how you defend, read by the Real AI bot (fades over time)
let rdSpinObj=null;
const nowS=()=>performance.now()/1000;
function rdPush(a,v){a.push(v);if(a.length>8)a.shift()}
function rdShot(three,fade){rdPush(rdHist.shots,{t:nowS(),x:P.x,y:P.y,three,fade})}
function rdUpdate(){
  const t=nowS(),S=rdHist.shots.filter(s=>t-s.t<60),l4=S.slice(-4),n=S.length,L=S[n-1],L2=S[n-2];
  const nf={
    fade:l4.filter(s=>s.fade).length>=2,
    three:l4.length>=3&&l4.filter(s=>s.three).length>=3,
    // you shot twice from about the same place and are standing there again
    spot:n>=2&&Math.hypot(L.x-L2.x,L.y-L2.y)<45&&Math.hypot(P.x-L.x,P.y-L.y)<60,
    spin:rdHist.spins.filter(x=>t-x<10).length>=3,
    pump:rdHist.pumps.filter(x=>t-x<12).length>=2
  },nm={fade:'FADE',three:'3s',spot:'SPOT',spin:'SPIN',pump:'FAKE'};
  for(const k in nf){if(nf[k]&&!realRead[k]&&mode==='real')say('READ: '+nm[k],'#ffd24a');realRead[k]=nf[k]}
}
function pick(m){quit=false;if(kPick){kStart(m);return}if(view==='def'){startDef(m==='hard'?'medium':m);return}mode=m;stealGrace=2;idle=0;lateMark=0;stillT=0;fakeStreak=0;fakeT=0;biteT=0;pumpT=0;tgt.x=D.x;tgt.y=D.y;showPick(false)}
be.onclick=()=>pick('easy');bh.onclick=()=>pick('hard');bn.onclick=()=>pick('nightmare');bReal.onclick=()=>pick('real');
function steal(f){
  if(!f&&mode!=='easy'&&Math.random()<0.2){dunk={t:0,dur:1.6,sx:D.x,sy:D.y};hold=false;shot=null;spin=null;tg=null;say('DUNK!','#ff8a8a');return}
  jabs=0;jabT=0;fakeStreak=0;fakeT=0;biteT=0;pumpT=0;
  if(king){say('STOLEN','#ff8a8a');kRes='miss';kNext();return}
  say('STOLEN','#ff8a8a');
  P.x=180;P.y=440;D.x=180;D.y=300;hold=false;fill=0;shot=null;spin=null;tg=null;mode=null;lateT=0;fadeOn=false;fade=0;showPick(true);
}
function moved(){const l=(mode==='hard'&&Math.random()<0.3)||(mode==='nightmare'&&Math.random()<0.07)||(mode==='real'&&!realRead.spin&&Math.random()<0.03);lateT=l?0.45:0;if(l)lateMark=1.2}
const ptrs=new Map();
function syncTg(){const v=[...ptrs.values()];tg=v.length?v[v.length-1]:null}
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*420/r.width-30,y:(e.clientY-r.top)*480/r.height}}
cv.addEventListener('pointerdown',e=>{
  const q=pt(e),now=performance.now(),solo=ptrs.size===0;
  if(quit){quit=false;return}
  if(view==='def'){if(dmode&&dEnd<=0&&now-lastTap>=300&&Math.hypot(q.x-B.x,q.y-B.y)<34)stealTry();if(dmode&&solo&&now-lastTap<300&&defAct(q)){lastTap=0;cv.setPointerCapture(e.pointerId);return}if(solo)lastTap=now;ptrs.set(e.pointerId,q);syncTg();cv.setPointerCapture(e.pointerId);return}
  if(mode&&solo&&now-lastTap<300&&spinCD<=0&&!spin&&!shot&&hasBall==='player'&&!passBall){
    const dx=q.x-P.x,dy=q.y-P.y;
    if(dy<-12&&-dy>2*Math.abs(dx)&&canFwd()){fwdMove();tg=null;lastTap=0;cv.setPointerCapture(e.pointerId);return}
    if(dy>12&&dy>2*Math.abs(dx)){spin={t:0,dur:0.35,dist:55,dx:0,dy:1,dir:0};spinCD=0.9;fade=1.2;idle=0;tg=null;lastTap=0;moved();cv.setPointerCapture(e.pointerId);return}
    if(Math.abs(dx)>=10&&Math.abs(dx)>=0.5*Math.abs(dy)){
      const s=Math.sign(dx),vy=clamp(dy/Math.abs(dx),-0.6,0.6),m=Math.hypot(1,vy);
      spin={t:0,dur:0.22,dist:85,dx:s/m,dy:vy/m,dir:s};spinCD=0.9;tg=null;lastTap=0;moved();cv.setPointerCapture(e.pointerId);return;
    }
  }
  if(solo)lastTap=now;ptrs.set(e.pointerId,q);syncTg();cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(ptrs.has(e.pointerId)){ptrs.set(e.pointerId,pt(e));syncTg()}});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>cv.addEventListener(n,e=>{ptrs.delete(e.pointerId);syncTg()}));
const btn=document.getElementById('shoot');
btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);if(view==='def'){if(dmode&&dEnd<=0){bHold=true;bHoldT=0}return}if(mode&&!dunk&&!shot&&!(spin&&spin.jump)&&wait<=0&&hasBall==='player'&&!passBall){hold=true;fill=0;fadeOn=fade>0;fade=0;idle=0;blockTry=mode==='easy'?Math.random()<0.1:Math.random()>=(mode==='hard'?0.23:mode==='real'?(realRead.spot?0:0.01):0.05)}});
['pointerup','pointercancel'].forEach(n=>btn.addEventListener(n,()=>{if(view==='def'&&bHold){bHold=false;blockAct(false)}if(hold)release()}));
function release(){
  hold=false;
  if(spin&&spin.jump)return; // no regular shot while a dunk leap is in the air
  if(stillT>=2.5){const ax=D.x-P.x,ay=D.y-P.y,am=Math.hypot(ax,ay)||1;if(am>45){D.x=P.x+ax/am*45;D.y=P.y+ay/am*45}}
  const d=dist(),hw=halfW(),err=fill-gc(),ae=Math.abs(err),dc=dd();
  const inPaint=P.x>130&&P.x<230&&P.y<168;
  // Base contest block chance (existing logic)
  const fr=mode==='real'?(realRead.fade?[95,0.8]:[80,0.6]):[70,0.5];
  const bp=isNM(mode)&&fadeOn?(dc<fr[0]?fr[1]:0):clamp((58-dc)/36,0,0.85)-(fadeOn?0.1:0);
  const biting=biteT>0;
  let blk=!biting&&((stillT>=2.5&&dc<70)||(blockTry&&lateMark<=0&&Math.random()<bp*lkE()));
  // Paint power-block: AI has a strong chance to reject shots in the paint
  if(!blk&&!biting&&inPaint&&dc<70){
    const pwrChance=mode==='easy'?0.35:mode==='hard'?0.55:mode==='real'?0.85:0.75; // easy / hard / nightmare
    if(Math.random()<pwrChance*lkE())blk=true;
  }
  const three=d>170||Math.abs(P.x-HX)>150;
  // Two pump fakes in a row: Hard/Nightmare read it and block the next shot instantly
  if(mode!=='easy'&&fakeStreak>=2)blk=true;
  fakeStreak=0;fakeT=0;
  if(mode==='real')rdShot(three,fadeOn);
  let r,tx=HX,ty=HY;
  if(blk){r='block';tx=P.x+(Math.random()*70-35);ty=Math.min(P.y+55,470)}
  else if(ae<=hw){r='green'}
  else if(ae<=hw+0.07){r='rim';tx=HX+(Math.random()<.5?-1:1)*13;ty=HY+(Math.random()<.5?-9:9)}
  else if(err<0){r='short';tx=HX+(Math.random()*16-8);ty=HY+34}
  else{r='long';tx=HX+(Math.random()*16-8);ty=HY-30}
  att++;
  shot={t:0,dur:r==='block'?0.3:0.55+d/700,sx:P.x,sy:P.y,tx,ty,r,three,fillAt:fill};
  stats();
}
function finish(){
  const s=shot;
  if(s.r==='green'){
    made++;greens++;pts+=s.three?3:2;say('GREEN  +'+(s.three?3:2),'#5dff7a');
    if(PC.neonShine&&s.three)shineT=2.5;
    if(PC.cash)cashT=1.6;
  }
  else if(s.r==='block')say('BLOCKED','#ff8a8a');
  else if(s.r==='rim')say('Rim out','#ffd166');
  else if(s.r==='short')say('Short','#ff8a8a');
  else say('Long','#ff8a8a');
  stats();wait=0.6;s.after=true;s.t=0;s.dur=0.5;if(king){wait=1.5;kWait=1;kPts=s.three?3:2;kRes=s.r==='green'?'make':'miss'}
}
function moveD(dt){
  const hard=mode!=='easy',nm=isNM(mode),idleAt=mode==='real'?3:5;
  if(mode==='real'){rdUpdate();if(spin&&spin!==rdSpinObj&&!spin.jump)rdPush(rdHist.spins,nowS());rdSpinObj=spin}
  ht=hold?ht+dt:0;
  if(lateT>0)lateT-=dt;
  if(lateMark>0)lateMark-=dt;
  if(nm){idle+=dt;if(idle<idleAt)angryN=0}
  if(stealCD>0)stealCD-=dt;
  const hx=HX-P.x,hy=HY-P.y,hm=Math.hypot(hx,hy)||1,off=(hard?36+26*clamp((hm-50)/200,0,1):44)+(mode==='real'&&realRead.three?10:0);
  const rushAt=blockTry?(mode==='real'&&realRead.spot?0.05:0.15):9;
  if(lateT<=0){
    if(hold&&ht>rushAt){tgt.x=P.x;tgt.y=P.y}else{tgt.x=P.x+hx/hm*off;tgt.y=P.y+hy/hm*off}
  }
  if(nm&&idle>=idleAt&&!hold){tgt.x=P.x;tgt.y=P.y}
  // Pump-fake bite: quick lunge at the fake, then he's stuck recovering
  let bm=1;
  if(biteT>0){biteT-=dt;if(BITE_T-biteT<0.2){tgt.x=P.x;tgt.y=P.y;bm=1.35}else{tgt.x=D.x;tgt.y=D.y;bm=0.4}}
  tgt.x=clamp(tgt.x,-12,372);tgt.y=clamp(tgt.y,30,462);
  const dx=tgt.x-D.x,dy=tgt.y-D.y,m=Math.hypot(dx,dy);
  if(m>2){const v=Math.min(m,SPD*(nm?(idle>=idleAt?0.85:(mode==='real'?1.1:1)):hard?0.8:0.7)*lkE()*bm*dt);D.x+=dx/m*v;D.y+=dy/m*v}
  const px=D.x-P.x,py=D.y-P.y,pm=Math.hypot(px,py);
  if(pm<26&&pm>0){D.x=P.x+px/pm*26;D.y=P.y+py/pm*26}
  D.x=clamp(D.x,-12,372);D.y=clamp(D.y,30,462);
  if(nm){
    const ip=P.x>130&&P.x<230&&P.y<168;
    if(!ip)jabs=0;
    if(jabT>0)jabT-=dt;
    if(stealGrace<=0&&biteT<=0&&idle>=idleAt&&!shot&&!hold&&stealCD<=0&&dd()<34){stealCD=0.8;jabT=0.2;const q=dd()||1;jdx=(P.x-D.x)/q;jdy=(P.y-D.y)/q;angryN++;if(Math.random()<lk(angryN<=1?0.45:0.9))steal()}
    else if(stealGrace<=0&&biteT<=0&&ip&&!shot&&!hold&&stealCD<=0&&dd()<44){stealCD=0.7;jabs++;jabT=0.2;const q=dd()||1;jdx=(P.x-D.x)/q;jdy=(P.y-D.y)/q;if(Math.random()<lk(jabs>=2?1:0.45))steal()}
  }else if(stealGrace<=0&&biteT<=0&&hard&&!shot&&!hold&&stealCD<=0&&dd()<30){
    stealCD=1.3;
    if(Math.random()<lk(0.5))steal();
  }
}
function update(dt){
  mv=false;
  const ox=P.x,oy=P.y;
  if(spinCD>0)spinCD-=dt*hMul();
  if(fade>0&&!hold)fade-=dt;
  if(turnCD>0)turnCD-=dt;
  if(pumpT>0)pumpT-=dt;
  if(fakeT>0){fakeT-=dt;if(fakeT<=0)fakeStreak=0}
  if(spin){mv=true;spin.t+=dt;const k=2*Math.max(0,1-spin.t/spin.dur)/spin.dur*spin.dist*dt;P.x=clamp(P.x+spin.dx*k,-12,372);P.y=clamp(P.y+spin.dy*k,100,462);if(spin.t>=spin.dur){if(spin.jump){if(PC.burger)rumbleFloor();resolveDunk()}else if(spin.res)doDunk(spin.res);spin=null}}
  else if(!shot&&tg){
    const dx=tg.x-P.x,dy=tg.y-P.y,m=Math.hypot(dx,dy);
    if(m>2){mv=true;const v=Math.min(m,SPD*spdMul()*dt);P.x+=dx/m*v;P.y+=dy/m*v}
    P.x=clamp(P.x,-12,372);P.y=clamp(P.y,100,462);
    const vx=P.x-ox,vy=P.y-oy,vm=Math.hypot(vx,vy);
    if(vm>0.5){
      const ux=vx/vm,uy=vy/vm;
      if(pd&&turnCD<=0&&pd.x*ux+pd.y*uy<-0.2){moved();turnCD=0.5}
      if(pd){const nx=pd.x*0.85+ux*0.15,ny=pd.y*0.85+uy*0.15,nm=Math.hypot(nx,ny)||1;pd={x:nx/nm,y:ny/nm}}else pd={x:ux,y:uy};
    }else pd=null;
  }
  if(mv)stillT=0;else stillT+=dt;
  if(hold){fill+=dt/(mv?0.3:0.45);if(fill>=1){fill=1;release()}}
  if(shot){
    shot.t+=dt;
    if(!shot.after&&shot.t>=shot.dur){finish()}
    else if(shot.after&&shot.t>=shot.dur){shot=null;fadeOn=false}
  }
  if(wait>0)wait-=dt;
  moveD(dt);
}
function step(ts){
  const dt=Math.min((ts-last)/1000,0.05)||0.016;last=ts;
  if(window.__mpFrame&&window.__mpFrame(dt)){requestAnimationFrame(step);return} // online 1v1 runs its own frame
  if(msgT>0)msgT-=dt;
  if(shakeT>0)shakeT-=dt;
  if(stealGrace>0)stealGrace-=dt;
  if(shineT>0)shineT-=dt;
  if(cashT>0)cashT-=dt;
  if(twinT>0)twinT-=dt;
  pollPad(dt);

      // Cosmetic skin effects when YOU score
      if (off === myIdx && /^GREEN/.test(e.t)) {
        if (PC.neonShine && /\+3/.test(e.t)) shineT = 2.5;
        if (PC.cash) cashT = 1.6;
        if (PC.twin) twinT = 1.8;
      }
    }
  }
}

/* ----- guest: apply what the host says ----- */
function applySnap(m) {
  const prevOff = gVM ? gVM.off : -1, prevPh = gVM ? gVM.ph : '';
  gVM = m;
  const hp = m.p[myIdx], op = m.p[1 - myIdx];
  if (!me) me = { x: hp.x, y: hp.y, dash: null, dashCD: 0, stun: 0, fade: 0, pump: 0, blkCD: 0, stlCD: 0, moving: false };
  else {
    const err = Math.hypot(hp.x - me.x, hp.y - me.y);
    if (m.off !== prevOff || (m.ph === 'play' && prevPh !== 'play') || err > 45) { me.x = hp.x; me.y = hp.y; me.dash = null; lh.on = false; }
    else if (err > 10) { me.x += (hp.x - me.x) * 0.3; me.y += (hp.y - me.y) * 0.3; }
    me.stun = hp.stun ? 0.15 : 0;
  }
  if (!opp) opp = { x: op.x, y: op.y };
  if (m.ev && m.ev.length) handleEvents(m.ev, m.off);
}

/* ----- input ----- */
const isOff = () => !!gVM && gVM.off === myIdx;
function buildInput() {
  I.dx = (K.has('KeyD') || K.has('ArrowRight') ? 1 : 0) - (K.has('KeyA') || K.has('ArrowLeft') ? 1 : 0);
  I.dy = (K.has('KeyS') || K.has('ArrowDown') ? 1 : 0) - (K.has('KeyW') || K.has('ArrowUp') ? 1 : 0);
  let tp = null; for (const v of ptrs.values()) tp = v;
  I.tx = tp ? Math.round(tp.x * 10) / 10 : null; I.ty = tp ? Math.round(tp.y * 10) / 10 : null;
}
function sendInput() {
  send({ k: 'in', q: ++inq, dx: I.dx, dy: I.dy, tx: I.tx, ty: I.ty, hold: I.hold, blkN: I.blkN, stlN: I.stlN, shfN: I.shfN, shfDir: I.shfDir, fadN: I.fadN, pmpN: I.pmpN, relN: I.relN, relFill: I.relFill });
}
function canShootNow() { return !!gVM && gVM.ph === 'play' && !gVM.shot && !gVM.w && !!me; }
function actDown() {
  if (!gVM || gVM.ph === 'over' || gone) return;
  if (isOff()) {
    I.hold = true;
    if (role === 'guest' && canShootNow()) { lh.on = true; lh.fill = 0; lh.fade = me.fade > 0; me.fade = 0; sendInput(); }
  } else { I.blkN++; snd('jump', 0.7); if (role === 'guest') sendInput(); }
}
function releaseLocal() { I.relN++; I.relFill = Math.round(lh.fill * 1000) / 1000; I.hold = false; lh.on = false; sendInput(); }
function actUp() {
  if (!I.hold) return;
  I.hold = false;
  if (role === 'guest') { if (lh.on) releaseLocal(); else sendInput(); }
  else I.relN++;
}
function shuffle(dir) {
  if (!gVM || gVM.ph !== 'play' || gone) return;
  I.shfN++; I.shfDir = dir; snd('squeak', 0.8);
  if (role === 'guest' && me) {
    const busy = isOff() && (lh.on || (gVM.shot && !gVM.shot.after));
    if (me.dashCD <= 0 && !busy) { me.dash = { dir, t: MPC.DASH_T }; me.dashCD = 0.9; }
    sendInput();
  }
}
function fadePress() { if (!gVM || gone) return; I.fadN++; if (role === 'guest') { if (isOff() && me) me.fade = 1.2; sendInput(); } }
function stealPress() { if (!gVM || gone) return; I.stlN++; if (role === 'guest') sendInput(); }
function pumpPress() {
  if (!gVM || gone || !isOff() || gVM.ph !== 'play' || gVM.shot || gVM.w) return;
  if (role === 'guest' && me && me.pump > 0) return;
  I.pmpN++;
  if (role === 'guest' && me) { me.pump = 0.3; snd('fake'); }
  if (role === 'guest') sendInput();
}

const MPK = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE', 'KeyF', 'KeyR', 'KeyX']);
const mpLast = { A: 0, D: 0, S: 0, W: 0 };
window.addEventListener('keydown', e => {
  if (!on || !MPK.has(e.code)) return;
  e.preventDefault(); if (e.repeat) return;
  K.add(e.code);
  const now = performance.now();
  if (e.code === 'Space') actDown();
  else if (e.code === 'KeyQ') shuffle(-1);
  else if (e.code === 'KeyE') shuffle(1);
  else if (e.code === 'KeyF') fadePress();
  else if (e.code === 'KeyR') pumpPress();
  else if (e.code === 'KeyX') stealPress();
  // Double-tap A/D = shuffle, double S = fade, double W = pump (same as single-player)
  else if (e.code === 'KeyA') {
    if (now - mpLast.A < 300) { shuffle(-1); mpLast.A = 0; } else mpLast.A = now;
  } else if (e.code === 'KeyD') {
    if (now - mpLast.D < 300) { shuffle(1); mpLast.D = 0; } else mpLast.D = now;
  } else if (e.code === 'KeyS') {
    if (now - mpLast.S < 300) { fadePress(); mpLast.S = 0; } else mpLast.S = now;
  } else if (e.code === 'KeyW') {
    if (now - mpLast.W < 300) { pumpPress(); mpLast.W = 0; } else mpLast.W = now;
  }
});
window.addEventListener('keyup', e => { if (!on || !MPK.has(e.code)) return; K.delete(e.code); if (e.code === 'Space') actUp(); });
window.addEventListener('blur', () => { if (on) { K.clear(); actUp(); } });
btn.addEventListener('pointerdown', () => { if (on) actDown(); });
['pointerup', 'pointercancel'].forEach(n => btn.addEventListener(n, () => { if (on) actUp(); }));
passBtn.addEventListener('pointerdown', () => { if (on) { isOff() ? fadePress() : stealPress(); } });
cv.addEventListener('pointerdown', e => { if (on) ptrs.set(e.pointerId, pt(e)); });
cv.addEventListener('pointermove', e => { if (on && ptrs.has(e.pointerId)) ptrs.set(e.pointerId, pt(e)); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => cv.addEventListener(n, e => ptrs.delete(e.pointerId)));
['menu', 'reset', 'swap', 'king'].forEach(id => { const el = document.getElementById(id); if (el) el.addEventListener('click', () => { if (on || peer) leave(); }, true); });
window.addEventListener('beforeunload', () => leave());

/* ----- one frame: called from the game's main loop while an online match is on ----- */
window.__mpFrame = function (dt) {
  if (!on) return false;
  const now = performance.now();
  buildInput();
  if (role === 'host') {
    acc += Math.min(dt, 0.1);
    while (acc >= 1 / 60) { MPC.step(S, 1 / 60, [I, gIn], Math.random); acc -= 1 / 60; }
    if (S.ev.length) { const list = S.ev; S.ev = []; pend.push(...list); handleEvents(list, S.off); }
    gVM = MPC.toVM(S);
    if (now - lastSend >= 33) { lastSend = now; send(Object.assign({ k: 'snap', n: ++seq, ev: pend }, gVM)); pend = []; }
  } else if (gVM && me) {
    MPC.movePlayer(me, I, dt, gVM.off === myIdx ? 100 : 30);
    if (lh.on) {
      if (gVM.shot || gVM.ph !== 'play') lh.on = false;
      else { lh.fill += dt / (me.moving ? 0.3 : 0.45); if (lh.fill >= 1) { lh.fill = 1; releaseLocal(); } }
    }
    if (now - lastSend >= 33) { lastSend = now; sendInput(); }
  }
  if (now - lastPing > 1500) { lastPing = now; send({ k: 'ping', t: now }); }
  if (msg.left > 0) msg.left -= dt;
  if (gone) { goneT -= dt; if (goneT <= 0) { leave(); showMain(); return true; } }
  render(dt);
  return true;
};

/* ----- drawing ----- */
function meterDraw(pos, hw, f, show) {
  const side = pos.x > 320 ? -34 : 34, mx = pos.x + side, mh = 80, my = clamp(pos.y - mh / 2, 70, 460 - mh);
  x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(mx - 7, my - 2, 14, mh + 4);
  const g = MPC.gc(hw), top = my + mh * (1 - (g + hw)), h = mh * 2 * hw;
  x.fillStyle = '#35d655'; x.fillRect(mx - 6, top, 12, h);
  if (show) { x.fillStyle = '#fff'; x.fillRect(mx - 9, my + mh * (1 - f) - 1.5, 18, 3); }
}
function label(t, px, py) {
  x.textAlign = 'center'; x.fillStyle = '#fff'; x.strokeStyle = 'rgba(0,0,0,.6)'; x.lineWidth = 3; x.font = '700 11px system-ui';
  x.strokeText(t, px, py); x.fillText(t, px, py);
}
function render(dt) {
  const vm = gVM; if (!vm) return;
  const off = vm.off, pos = [{ x: vm.p[0].x, y: vm.p[0].y }, { x: vm.p[1].x, y: vm.p[1].y }];
  const fl = [vm.p[0], vm.p[1]];
  if (role === 'guest' && me && opp) {
    const o = 1 - myIdx, k = 1 - Math.exp(-dt * 20);
    opp.x += (vm.p[o].x - opp.x) * k; opp.y += (vm.p[o].y - opp.y) * k;
    pos[myIdx] = { x: me.x, y: me.y }; pos[o] = { x: opp.x, y: opp.y };
    fl[myIdx] = { dash: me.dash ? 1 : 0, stun: me.stun > 0 ? 1 : 0, fade: me.fade > 0 ? 1 : 0, pump: me.pump > 0 ? 1 : 0, bk: vm.p[myIdx].bk };
  }
  const op = vm.p[1 - myIdx];
  if (op.dash && !prevOp.dash) snd('squeak', 0.6);
  if (op.bk && !prevOp.bk) snd('jump', 0.6);
  if (op.pump && !prevOp.pump) snd('fake', 0.8);
  prevOp = { dash: op.dash, bk: op.bk, pump: op.pump };

  const lbl = isOff() ? 'OFF' : 'DEF';
  if (lbl !== lastLbl) {
    lastLbl = lbl; btn.textContent = isOff() ? 'HOLD TO SHOOT' : 'BLOCK'; passBtn.textContent = isOff() ? 'FADE' : 'STEAL';
  }
  const hud = vm.sc[myIdx] + '|' + vm.sc[1 - myIdx] + '|' + vm.tg;
  if (hud !== lastHud) {
    lastHud = hud;
    const g = id => document.getElementById(id);
    g('l1').textContent = 'You '; g('p').textContent = vm.sc[myIdx];
    g('l2').textContent = 'Opp '; g('f').textContent = vm.sc[1 - myIdx];
    g('l3').textContent = 'To '; g('g').textContent = vm.tg;
  }

  x.setTransform(1, 0, 0, 1, 30, 0);
  court();
  for (const i of [0, 1]) {
    const p = pos[i], f = fl[i], mine = i === myIdx;
    if (mine) {
      // Use equipped skin for local player
      if (PC.burger) {
        x.fillStyle = 'rgba(0,0,0,.25)'; x.beginPath(); x.ellipse(p.x, p.y + 4, 14, 10, 0, 0, 7); x.fill();
        const sc = f.bk ? 1.35 : 1;
        x.save(); x.translate(p.x, p.y); x.scale(sc, sc); x.translate(-p.x, -p.y); drawBurger(p.x, p.y); x.restore();
      } else {
        drawPiece(p.x, p.y, PC, f.bk ? 1.35 : 1);
      }
      drawSkinFX(p.x, p.y);
      // Twin skin: brief duplicate after a make
      if (twinT > 0 && PC.twin) {
        const a = Math.min(1, twinT / 0.4) * 0.55;
        const ox = Math.sin(last / 80) * 18, oy = Math.cos(last / 90) * 10;
        x.globalAlpha = a;
        drawPiece(p.x + ox, p.y + oy, PC, 0.95);
        x.globalAlpha = 1;
      }
    } else {
      pawn(p.x, p.y, i === 0 ? '#3a6fd8' : '#e8803a', i === 0 ? '#14306e' : '#7a3410', 'rgba(255,255,255,.45)', f.bk ? 1.35 : 1);
    }
    if (f.stun) { x.fillStyle = 'rgba(0,0,0,.3)'; x.beginPath(); x.arc(p.x, p.y, 13, 0, 7); x.fill(); }
    if (f.bk) { x.strokeStyle = '#5dff7a'; x.lineWidth = 3; x.beginPath(); x.arc(p.x, p.y, 20, 0, 7); x.stroke(); }
    if (f.dash) { x.strokeStyle = '#fff'; x.lineWidth = 2; x.beginPath(); x.arc(p.x, p.y, 17, 0, 7); x.stroke(); }
    label(mine ? 'YOU' : 'OPP', p.x, p.y - 20);
    if (f.fade && off === i) label('FADE', p.x, p.y - 31);
    if (f.pump && off === i) label('PUMP', p.x, p.y - 31);
  }
  const po = pos[off], sh = vm.shot;
  const pumpH = (!sh && fl[off] && fl[off].pump) ? 20 : 0;
  if (!sh) ball(po.x + 14, po.y - 2, pumpH);
  else if (!sh.after) { const u = clamp(sh.t / sh.dur, 0, 1); ball(sh.sx + (sh.tx - sh.sx) * u, sh.sy + (sh.ty - sh.sy) * u, Math.sin(Math.PI * u) * 70 + u * 10); }
  else if (sh.r !== 'green' && sh.r !== 'block') { const u = sh.t / sh.dur; ball(sh.tx + (sh.tx - MPC.HX) * u * 3, sh.ty + (sh.ty - MPC.HY) * u * 3, 10 * (1 - u)); }
  if (off === myIdx && vm.ph === 'play') {
    const dd = pos[1 - off], dist = Math.hypot(po.x - MPC.HX, po.y - MPC.HY), dc = Math.hypot(dd.x - po.x, dd.y - po.y);
    const fadeOn = role === 'guest' ? (lh.on ? lh.fade : me && me.fade > 0) : (vm.hold.on ? vm.hold.fade : vm.p[off].fade);
    const hw = MPC.halfW(dist, dc, fadeOn);
    const f = role === 'guest' ? lh.fill : vm.hold.fill;
    meterDraw(po, hw, sh ? sh.fillAt : f, role === 'guest' ? (lh.on || (sh && !sh.after)) : (vm.hold.on || (sh && !sh.after)));
  }
  x.textAlign = 'center'; x.font = '700 12px system-ui'; x.fillStyle = 'rgba(0,0,0,.45)'; x.fillRect(-30, 0, 420, 16);
  x.fillStyle = '#fff'; x.fillText((isOff() ? 'YOUR BALL' : 'DEFEND') + (rtt >= 0 ? '  |  ' + rtt + ' ms' : ''), 180, 12);
  if (msg.left > 0) { x.fillStyle = msg.c; x.strokeStyle = 'rgba(0,0,0,.6)'; x.lineWidth = 4; x.font = '800 30px system-ui'; x.strokeText(msg.t, 180, 240); x.fillText(msg.t, 180, 240); }
  if (vm.ph === 'over') {
    x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(-30, 180, 420, 120);
    x.textAlign = 'center'; x.fillStyle = vm.win === myIdx ? '#5dff7a' : '#ff8a8a'; x.font = '800 34px system-ui';
    x.fillText(vm.win === myIdx ? 'YOU WIN!' : 'YOU LOSE', 180, 232);
    x.fillStyle = '#fff'; x.font = '600 16px system-ui'; x.fillText(vm.sc[myIdx] + ' - ' + vm.sc[1 - myIdx] + '  |  tap Menu to leave', 180, 266);
  }
}
window.__mpMenu = menu;
window.__mpDebug = () => ({ vm: gVM, me, rtt, gone, on, role }); // read-only peek, used by tests
})();

</script>
